; PlatformIO project configuration for the CH32 Temple controller.
; This project builds a CH32V003-based firmware using the WCH noneOS SDK.
; The board selected here matches the generic CH32V003A4M6 target used in this workspace.

[env:genericCH32V003A4M6]
platform = ch32v
board = genericCH32V003A4M6
framework = noneos-sdk
monitor_speed = 115200

monitor_echo = yes
monitor_filters = send_on_enter

; CH32V003A4M6 board configuration

; Use the WCH-LinkE debugger/programmer for upload and debugging
upload_protocol = wlink
debug_tool = wch-link
; Optional: break at main when a debug session starts
debug_init_break = tbreak main